<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Marble</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="board">
      <canvas id="game" width="800" height="600"></canvas>
    </div>

    <div class="holes">
      <div id="even" class="hole">偶数</div>
      <div id="odd" class="hole">奇数</div>
      <div id="prime" class="hole">素数</div>
      <div id="three" class="hole">3の倍数</div>
      <div id="five" class="hole">5の倍数</div>
      <div id="seven" class="hole">7の倍数</div>
      <div id="square root" class="hole">平方根</div>
      <div id="fibonacci" class="hole">フィボナッチ数</div>
    </div>

    <button id="start">開始</button>

    <script src="script.js"></script>
  </body>
</html>
